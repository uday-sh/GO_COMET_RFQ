upstream bidbolt_app {
    # Nginx uses round-robin by default when no balancing method is specified.
    server app1:8000 max_fails=3 fail_timeout=10s;
    server app2:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://bidbolt_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location ~ ^/api/(auth/(token|admin/token|register)|rfqs/[0-9]+/bids)$ {
        limit_req zone=bidbolt_write burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @api_rate_limited;
        proxy_pass http://bidbolt_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location @api_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Too many requests; retry shortly"}';
    }
}
