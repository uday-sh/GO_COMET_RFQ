upstream bidbolt_app {
    # Round-robin is Nginx's default upstream distribution method.
    server app1:8000 max_fails=3 fail_timeout=10s;
    server app2:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/bidbolt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bidbolt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://bidbolt_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location ~ ^/api/(auth/(token|admin/token|register)|rfqs/[0-9]+/bids)$ {
        limit_req zone=bidbolt_write burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @api_rate_limited;
        proxy_pass http://bidbolt_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location @api_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Too many requests; retry shortly"}';
    }
}
