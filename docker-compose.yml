services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rfq
      POSTGRES_USER: rfq
      POSTGRES_PASSWORD: rfq-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfq -d rfq"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://rfq:rfq-local-only@db:5432/rfq
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting Docker Compose}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
